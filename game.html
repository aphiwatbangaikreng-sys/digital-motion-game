<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>Digital Motion Game - เล่นเกม</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    body {
      font-family: 'Kanit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #game-screen {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    video {
      display: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .hud {
      position: absolute;
      top: 14px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 10;
      pointer-events: none;
    }

    .hud-pill {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: clamp(15px, 2.4vw, 22px);
      font-weight: 700;
      color: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    .instructions {
      position: absolute;
      bottom: 14px;
      width: 100%;
      text-align: center;
      color: white;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
      font-size: clamp(12px, 1.7vw, 17px);
      z-index: 10;
      pointer-events: none;
      padding: 0 12px;
      box-sizing: border-box;
    }

    .info-box {
      display: none;
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
    }

    .info-box button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .calib-box {
      display: none;
      position: absolute;
      z-index: 30;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(92vw, 420px);
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      color: #fff;
      border-radius: 14px;
      padding: 16px 18px 18px;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .calib-box h3 { margin: 0 0 6px; font-size: 16px; }
    .calib-status { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
    .calib-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
    .calib-table td { padding: 4px 2px; border-bottom: 1px solid rgba(255,255,255,0.12); }
    .calib-table td:last-child { text-align: right; font-family: monospace; font-weight: 700; }
    #calibStartBtn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: linear-gradient(90deg, #7c3aed, #06b6d4); color: #fff;
      font-size: 15px; font-weight: 700; font-family: 'Kanit', sans-serif; cursor: pointer;
    }
    #calibStartBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>

<body>
  <div id="game-screen">
    <div id="game-container">
      <div class="hud">
        <div id="scoreDisplay" class="hud-pill">คะแนน: 0</div>
        <div id="timeDisplay" class="hud-pill">เวลา: 30</div>
      </div>
      <video id="video" autoplay playsinline></video>
      <canvas id="output_canvas"></canvas>
      <p class="instructions" id="instructionsText">แตะกล่องคำตอบที่ถูกต้องด้วยมือให้ตรงกับคำสั่ง!</p>

      <div id="calibration-box" class="calib-box">
        <h3>📏 ตรวจสอบตำแหน่งก่อนเริ่มเกม</h3>
        <p id="calibStatusText" class="calib-status">กำลังตรวจจับ...</p>
        <table class="calib-table">
          <tr><td>ความกว้างไหล่ (shoulderWidth)</td><td id="calibShoulderWidth">-</td></tr>
          <tr><td>จุดกึ่งกลางตัว X (centerX)</td><td id="calibCenterX">-</td></tr>
          <tr><td>ค่าเบี่ยงจากกึ่งกลาง (offsetX)</td><td id="calibOffsetX">-</td></tr>
          <tr><td>มองเห็นไหล่ชัดเจน</td><td id="calibVisibility">-</td></tr>
        </table>
        <button id="calibStartBtn" disabled>▶️ เริ่มเกม</button>
      </div>
    </div>
  </div>

  <div id="error-box" class="info-box">
    <h3 id="error-title">⚠️ ไม่สามารถเข้าถึงกล้องได้</h3>
    <p id="error-message"></p>
    <button onclick="window.close()">ปิดแท็บนี้</button>
  </div>

  <div id="result-box" class="info-box">
    <h3>🏁 จบเกม!</h3>
    <p>คะแนนที่ได้: <b id="resultScoreText">0</b></p>
    <button onclick="location.reload()">🔁 เล่นอีกครั้ง</button>
  </div>

  <script>
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const videoElement = document.getElementById('video');

    const urlParams = new URLSearchParams(window.location.search);
    const pName = urlParams.get('name') || 'ผู้เล่น';
    const pEmpId = urlParams.get('empId') || '';
    const currentMode = urlParams.get('mode') || 'color';
    const returnUrl = urlParams.get('returnUrl') || '';
    const hasReturnUrl = !!returnUrl; // เปิดผ่านหน้าแรกมาหรือไม่ (มี returnUrl ให้ redirect กลับไปบันทึกคะแนน)

    const INSTRUCTIONS = {
      color: 'ดูที่ "สีหมึก" ของคำสั่งด้านบน (ไม่ใช่ความหมายของคำ) แล้วชี้ไปที่กล่องที่มีสีจริงตรงกับสีหมึกนั้น กำมือค้างไว้สักครู่เพื่อยืนยัน เช่น คำว่า "สีเขียว" แต่เขียนด้วยหมึกสีแดง ต้องกำมือที่กล่องสีแดงเท่านั้น! อย่าถูกคำที่เขียนบนกล่องหลอก ดูที่สีจริงของกล่อง ⚠️ ระวังของสีแดงมีหนาม ห้ามแตะ',
      digital: 'ชี้ไปที่ "กล่องเครื่องมือดิจิทัล" ที่มีชื่อตรงกับคำสั่ง แล้วกำมือค้างไว้สักครู่เพื่อยืนยัน! ⚠️ ระวังของสีแดงมีหนาม ห้ามแตะ',
      shape: 'ดูที่ "รูปทรงและสีจริง" ที่วาดอยู่ในกล่องโจทย์ด้านบน (ไม่ใช่ตัวหนังสือที่เขียนกำกับไว้ ซึ่งจงใจเขียนหลอกเสมอ) แล้วชี้ไปที่รูปทรงลอยที่มีรูปทรง+สีตรงกันทุกประการ กำมือค้างไว้สักครู่เพื่อยืนยัน อย่าถูกคำที่เขียนบนกล่องโจทย์หรือบนรูปทรงลอยหลอก! ⚠️ ระวังของสีแดงมีหนาม ห้ามแตะ'
    };
    document.getElementById('instructionsText').innerText = INSTRUCTIONS[currentMode] || INSTRUCTIONS.color;

    let hands, camera, pose;
    let gameState = 'idle';
    let score = 0;
    let timeLeft = 60;
    let timerInterval;
    let isCooldown = false;
    let currentPrompt = {};
    let startTime = performance.now();
    let lastFrameTime = 0;
    let roundNumber = 0;

    let floatingBoxes = [];   // กล่องคำตอบที่ลอยไปมา รอบปัจจุบัน
    let obstacles = [];       // สิ่งกีดขวาง (แตะแล้วโดนหักคะแนน)
    let obstacleCooldown = { left: 0, right: 0 };
    let tapCooldown = { left: 0, right: 0 }; // กันแตะซ้ำรัวๆ หลังแตะผิด (เฟรม)
    let hoverId = { left: null, right: null }; // id กล่องที่มือกำลังอยู่ใกล้ๆ (ใช้ทำ highlight)
    let smoothedHand = { left: null, right: null }; // ตำแหน่งมือแบบ smoothing กันกระตุก
    let holdProgress = { left: 0, right: 0 };  // ความคืบหน้าการ "กำมือค้าง" เพื่อยืนยัน (0-1)
    let holdTargetId = { left: null, right: null }; // id กล่องที่กำลังนับ hold อยู่
    let particles = [];       // เอฟเฟกต์ระเบิดสีตอนได้คะแนน
    let feedback = null;      // ข้อความแจ้งเตือนชั่วคราว (เช่น "ผิด! ลองใหม่")

    const HOLD_DURATION_MS = 385;                 // เวลาที่ต้องกำมือค้างบนกล่องเพื่อยืนยันการเลือก
    const HOLD_GROW_RATE = 1 / HOLD_DURATION_MS;  // อัตราการเพิ่ม progress ต่อ ms ตอนกำมือค้าง
    const HOLD_DECAY_RATE = HOLD_GROW_RATE * 2.5; // อัตราการลด progress ต่อ ms ตอนคลายมือ (ลดเร็วกว่าตอนเพิ่ม)

    const CENTER_ZONE = { x: 0.5, y: 0.55, r: 0.11 }; // วงกลมเป้าหมายกลางจอ (สัดส่วนของ min(w,h))
    const OBSTACLE_HIT_RADIUS = 0.085;

    // ---------- ตรวจสอบตำแหน่งผู้เล่นก่อนเริ่มเกม (ระยะ + จุดกึ่งกลาง) ----------
    // ปรับค่าพวกนี้ตามหน้างานจริงได้เลย โดยดูตัวเลขสดจากตาราง Debug ตอน calibrate
    const SHOULDER_WIDTH_TOO_CLOSE = 0.30; // กว้างกว่านี้ = ยืนใกล้กล้องเกินไป ให้ถอยออก (เดิม 0.42 — ปรับให้ต้องถอยไกลขึ้น)
    const SHOULDER_WIDTH_TOO_FAR = 0.09;   // แคบกว่านี้ = ยืนไกล/ตรวจไม่ชัดเจน
    const CENTER_OFFSET_TOLERANCE = 0.12;  // ระยะเบี่ยงจากกึ่งกลางเฟรมที่ยอมรับได้
    const SHOULDER_VISIBILITY_MIN = 0.5;   // ความมั่นใจขั้นต่ำว่าเห็นไหล่ทั้งสองข้างชัด

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function showError(msg, title) {
      document.getElementById('game-screen').style.display = 'none';
      const box = document.getElementById('error-box');
      box.style.display = 'block';
      document.getElementById('error-title').innerText = title || '⚠️ ไม่สามารถเข้าถึงกล้องได้';
      document.getElementById('error-message').innerText = msg;
    }

    // บังคับต้องมีรหัสพนักงานก่อนเข้าเล่น (กันกรณีมีคนเปิดลิงก์หน้าเกมตรงๆ
    // โดยไม่ผ่านฟอร์มหน้าแรก ซึ่งจะไม่มี ?empId=... แนบมาด้วย)
    if (!pEmpId.trim()) {
      showError(
        'ไม่พบรหัสพนักงานในลิงก์นี้ กรุณาปิดแท็บนี้แล้วกลับไปกรอกชื่อและรหัสพนักงานที่หน้าแรกก่อนเริ่มเล่น',
        '🪪 กรุณากรอกรหัสพนักงานก่อนเล่น'
      );
    } else {
      initMediaPipe();
    }

    function initMediaPipe() {
      // ใช้ MediaPipe Hands แทน Pose: ให้จุด landmark ของมือ 21 จุด/ข้าง (ปลายนิ้ว/ข้อนิ้วครบ)
      // แม่นยำกว่าการประมาณตำแหน่งมือจากโครงร่างร่างกายแบบเดิมมาก และทำให้ตรวจจับท่ากำมือได้
      hands = new Hands({
        locateFile: function (file) {
          return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;
        }
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });

      hands.onResults(onResults);

      // Pose: ใช้ดูตำแหน่งไหล่ (ตัวคนทั้งตัว) เพื่อเช็คระยะห่าง+จุดกึ่งกลาง
      // ก่อนอนุญาตให้เริ่มเกม (Hands อย่างเดียวไม่รู้ว่าคนยืนใกล้/ไกล/เอียงแค่ไหน)
      pose = new Pose({
        locateFile: function (file) {
          return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;
        }
      });
      pose.setOptions({
        modelComplexity: 0,
        smoothLandmarks: true,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
      pose.onResults(onPoseResults);

      camera = new Camera(videoElement, {
        onFrame: async function () {
          await hands.send({ image: videoElement });
          await pose.send({ image: videoElement });
        },
        width: 960,
        height: 540
      });

      camera.start().then(function () {
        // เปิดกล้องสำเร็จ -> เข้าหน้าตรวจตำแหน่งก่อน (calibrating) ยังไม่เริ่มจับเวลา
        gameState = 'calibrating';
        document.getElementById('calibration-box').style.display = 'block';
      }).catch(function (error) {
        showError(
          'เปิดกล้องไม่สำเร็จ: ' + error.message +
          '\nโปรดตรวจสอบว่าไม่มีโปรแกรมอื่น (เช่น Zoom, Meet) แย่งใช้กล้องอยู่ และอนุญาตสิทธิ์กล้องให้เว็บไซต์นี้'
        );
      });
    }

    function startGamePlay() {
      document.getElementById('calibration-box').style.display = 'none';
      gameState = 'playing';
      score = 0;
      timeLeft = 60;
      roundNumber = 0;
      startTime = performance.now();
      updateTimeDisplay();
      generateNewPrompt();

      timerInterval = setInterval(function () {
        timeLeft--;
        updateTimeDisplay();
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    document.getElementById('calibStartBtn').addEventListener('click', function () {
      if (!this.disabled) startGamePlay();
    });

    // คำนวณตำแหน่ง/ระยะห่างของผู้เล่นจากจุด landmark ไหล่ซ้าย-ขวา (index 11, 12) ของ Pose
    function computeBodyMetrics(lm) {
      if (!lm || !lm[11] || !lm[12]) {
        return { detected: false, shoulderWidth: null, centerX: null, offsetX: null, visOk: false, status: 'no_person' };
      }
      const leftSh = lm[11], rightSh = lm[12];
      const shoulderWidth = Math.abs(leftSh.x - rightSh.x);
      const centerX = (leftSh.x + rightSh.x) / 2;
      const offsetX = centerX - 0.5;
      const visOk = (leftSh.visibility || 0) >= SHOULDER_VISIBILITY_MIN && (rightSh.visibility || 0) >= SHOULDER_VISIBILITY_MIN;

      let status = 'ok';
      if (!visOk) status = 'no_person';
      else if (shoulderWidth > SHOULDER_WIDTH_TOO_CLOSE) status = 'too_close';
      else if (shoulderWidth < SHOULDER_WIDTH_TOO_FAR) status = 'too_far';
      else if (Math.abs(offsetX) > CENTER_OFFSET_TOLERANCE) status = 'off_center';

      return { detected: true, shoulderWidth: shoulderWidth, centerX: centerX, offsetX: offsetX, visOk: visOk, status: status };
    }

    const CALIB_STATUS_TEXT = {
      no_person: '⚠️ ยังไม่เจอคนในเฟรม กรุณายืนให้เห็นตัวชัดๆ',
      too_close: '↩️ ใกล้กล้องเกินไป กรุณาถอยออกไปอีกหน่อย',
      too_far: '↪️ ไกล/ไม่ชัดเจน กรุณาขยับเข้ามาใกล้กล้องอีกนิด',
      off_center: '↔️ กรุณาขยับไปยืนตรงกลางเฟรม (ตรงหน้ากล้องพอดี)',
      ok: '✅ ตำแหน่งพร้อมแล้ว! กดปุ่มเริ่มเกมได้เลย'
    };

    function updateCalibrationUI(metrics) {
      document.getElementById('calibShoulderWidth').innerText = metrics.shoulderWidth !== null ? metrics.shoulderWidth.toFixed(3) : '-';
      document.getElementById('calibCenterX').innerText = metrics.centerX !== null ? metrics.centerX.toFixed(3) : '-';
      document.getElementById('calibOffsetX').innerText = metrics.offsetX !== null ? metrics.offsetX.toFixed(3) : '-';
      document.getElementById('calibVisibility').innerText = metrics.detected ? (metrics.visOk ? 'เห็นชัด' : 'ไม่ชัด/ไม่ครบ') : '-';

      const statusEl = document.getElementById('calibStatusText');
      statusEl.innerText = CALIB_STATUS_TEXT[metrics.status] || '';
      statusEl.style.color = metrics.status === 'ok' ? '#7CFC00' : '#ffd166';

      document.getElementById('calibStartBtn').disabled = metrics.status !== 'ok';
    }

    // วาดกรอบล้อมรอบตัวคนบนภาพกล้อง (สไตล์กรอบตรวจจับ AI) จากจุด landmark ที่ Pose มองเห็นชัด
    function drawPersonBoundingBox(lm, status) {
      if (!lm) return;
      let minX = 1, maxX = 0, minY = 1, maxY = 0, any = false;
      lm.forEach(function (p) {
        if ((p.visibility || 0) < 0.5) return;
        any = true;
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      });
      if (!any) return;

      const padX = (maxX - minX) * 0.12;
      const padY = (maxY - minY) * 0.08;
      minX = Math.max(0, minX - padX);
      maxX = Math.min(1, maxX + padX);
      minY = Math.max(0, minY - padY);
      maxY = Math.min(1, maxY + padY);

      const x = minX * canvasElement.width;
      const y = minY * canvasElement.height;
      const w = (maxX - minX) * canvasElement.width;
      const h = (maxY - minY) * canvasElement.height;

      const color = status === 'ok' ? '#7CFC00' : (status === 'no_person' ? '#ff4d4d' : '#ffd166');
      const cornerLen = Math.min(w, h) * 0.18;

      canvasCtx.save();
      canvasCtx.strokeStyle = color;
      canvasCtx.lineWidth = 4;
      canvasCtx.shadowColor = color;
      canvasCtx.shadowBlur = 10;

      // มุมกรอบ 4 มุมสไตล์ AI-detect
      const corners = [
        [x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]
      ];
      corners.forEach(function (c) {
        const cx = c[0], cy = c[1], dx = c[2], dy = c[3];
        canvasCtx.beginPath();
        canvasCtx.moveTo(cx, cy + cornerLen * dy);
        canvasCtx.lineTo(cx, cy);
        canvasCtx.lineTo(cx + cornerLen * dx, cy);
        canvasCtx.stroke();
      });

      // เส้นขอบจางๆ เต็มกรอบ ให้เห็นพื้นที่ชัดขึ้น
      canvasCtx.globalAlpha = 0.35;
      canvasCtx.lineWidth = 1.5;
      canvasCtx.strokeRect(x, y, w, h);
      canvasCtx.restore();
    }

    function onPoseResults(results) {
      const metrics = computeBodyMetrics(results.poseLandmarks);
      if (gameState === 'calibrating') {
        // วาดภาพกล้องสดพร้อมเส้นไกด์กึ่งกลาง ไว้ตอนตรวจตำแหน่งก่อนเริ่มเกม
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        drawPersonBoundingBox(results.poseLandmarks, metrics.status);

        canvasCtx.strokeStyle = 'rgba(255,255,255,0.35)';
        canvasCtx.lineWidth = 2;
        canvasCtx.beginPath();
        canvasCtx.moveTo(canvasElement.width / 2, 0);
        canvasCtx.lineTo(canvasElement.width / 2, canvasElement.height);
        canvasCtx.stroke();
        canvasCtx.restore();

        updateCalibrationUI(metrics);
      }
    }

    function updateTimeDisplay() {
      document.getElementById('timeDisplay').innerText = 'เวลา: ' + timeLeft + '  •  รอบ ' + roundNumber;
    }

    // ---------- คลังสี (ขยายจาก 4 เป็นสูงสุด 12 สี) ----------
    const COLOR_POOL = [
      { color: '#e74c3c', label: 'สีแดง' },
      { color: '#2ecc71', label: 'สีเขียว' },
      { color: '#3498db', label: 'สีน้ำเงิน' },
      { color: '#f1c40f', label: 'สีเหลือง' },
      { color: '#e67e22', label: 'สีส้ม' },
      { color: '#9b59b6', label: 'สีม่วง' },
      { color: '#ff5d9e', label: 'สีชมพู' },
      { color: '#00bcd4', label: 'สีฟ้า' },
      { color: '#8d6e63', label: 'สีน้ำตาล' },
      { color: '#7f8c8d', label: 'สีเทา' },
      { color: '#37474f', label: 'สีดำ' },
      { color: '#ecf0f1', label: 'สีขาว' }
    ];

    // รายชื่อเครื่องมือดิจิทัล (โหมด Digital Tools) พร้อมชุดสีที่ไล่โทนแยกกันชัดเจน
    const TOOL_LIST = [
      'Google Sheets', 'Google Slides', 'Google Docs', 'Google Forms', 'Google Calendar',
      'Google Drive', 'Google Meet', 'Google Chat', 'Google Gmail', 'Google Apps Script',
      'Python', 'Snowflake', 'Microsoft SQL Server', 'SAP', 'Augmentir',
      'DOMO', 'Sigma', 'Gemini', 'Notebook LM', 'Google Vids'
    ];
    const TOOL_COLORS = TOOL_LIST.map(function (_, i) {
      return 'hsl(' + Math.round(i * (360 / TOOL_LIST.length)) + ', 68%, 40%)';
    });

    // รูปทรงสำหรับโหมด shape
    const SHAPES = [
      { key: 'triangle', label: 'สามเหลี่ยม' },
      { key: 'square', label: 'สี่เหลี่ยม' },
      { key: 'circle', label: 'วงกลม' },
      { key: 'star', label: 'ดาว' }
    ];

    function randRange(min, max) { return min + Math.random() * (max - min); }
    function randIntDiff(n, exclude) {
      let v = Math.floor(Math.random() * n);
      while (v === exclude) v = Math.floor(Math.random() * n);
      return v;
    }
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }
    function isLightColor(hex) {
      const c = hex.replace('#', '');
      const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62;
    }

    // จำนวนกล่องต่อรอบ: ไล่ 3 -> 4 -> 6 -> 8 -> 9 แล้ววนกลับลงมา สลับไปมาเรื่อยๆ (ลดจำนวนลงจากเดิมเล็กน้อย)
    const COUNT_SEQUENCE = [3, 4, 6, 8, 9, 8, 6, 4];
    function countForRound(round) {
      return COUNT_SEQUENCE[round % COUNT_SEQUENCE.length];
    }

    // ขนาดกล่องเฉลี่ย: ยิ่งมีกล่องเยอะ ยิ่งย่อลงเล็กน้อยเพื่อให้พอดีจอ
    function baseSizeForCount(count) {
      return Math.max(0.10, 0.205 - (count - 4) * 0.010);
    }

    function grabRadiusForCount(count) {
      return Math.max(0.075, 0.115 - (count - 4) * 0.004);
    }

    // ยิ่งเล่นไปหลายรอบ กล่อง/สิ่งกีดขวางยิ่งขยับไวขึ้น (จำกัดเพดานไว้ไม่ให้ไวเกินไป)
    function speedMultiplierForRound(round) {
      return Math.min(1.7, 1 + Math.max(0, round - 1) * 0.035);
    }

    // ---------- วางกล่อง/สิ่งของแบบไม่ให้ทับกัน ----------
    function placeItems(defs, extraAvoid) {
      const placed = (extraAvoid || []).slice();
      const result = [];
      defs.forEach(function (def, i) {
        const w = def.w || 0.15, h = def.h || 0.15;
        const selfR = (w + h) / 4 + 0.025;
        let bx, by, tries = 0, ok = false;
        do {
          bx = randRange(0.12, 0.88);
          by = randRange(0.26, 0.88);
          tries++;
          ok = Math.hypot(bx - CENTER_ZONE.x, by - CENTER_ZONE.y) >= CENTER_ZONE.r + selfR + 0.05 &&
            placed.every(function (p) { return Math.hypot(bx - p.baseX, by - p.baseY) >= selfR + p.selfR + 0.015; });
        } while (!ok && tries < 80);

        const item = Object.assign({
          id: 'item_' + i + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          baseX: bx,
          baseY: by,
          selfR: selfR,
          radiusX: randRange(0.035, 0.075),
          radiusY: randRange(0.035, 0.075),
          speed: randRange(0.65, 1.25),
          phase: randRange(0, Math.PI * 2),
          x: bx,
          y: by,
          w: w,
          h: h
        }, def);

        placed.push(item);
        result.push(item);
      });
      return result;
    }

    function spawnObstacles(round, avoidBoxes) {
      const n = Math.min(3, 1 + Math.floor((round - 1) / 3));
      const defs = [];
      for (let i = 0; i < n; i++) {
        defs.push({ w: 0.14, h: 0.14, isObstacle: true });
      }
      obstacles = placeItems(defs, avoidBoxes).map(function (o) {
        o.radiusX = randRange(0.05, 0.095);
        o.radiusY = randRange(0.05, 0.095);
        o.speed = randRange(0.8, 1.4);
        return o;
      });
    }

    function generateNewPrompt() {
      hoverId = { left: null, right: null };
      holdProgress = { left: 0, right: 0 };
      holdTargetId = { left: null, right: null };
      particles = [];
      feedback = null;
      roundNumber++;

      if (currentMode === 'color') {
        const count = countForRound(roundNumber - 1);
        const pool = shuffle(COLOR_POOL.slice()).slice(0, count);
        // Stroop effect ที่ตัวคำสั่งเอง: "เขียนคำว่า" wordIndex แต่ "ระบายด้วยสีหมึก" inkIndex
        // คำตอบที่ถูกต้องคือกล่องที่มีสีจริงตรงกับ "สีหมึก" ของตัวอักษร ไม่ใช่ความหมายของคำที่เขียน
        const wordIndex = Math.floor(Math.random() * pool.length);
        const inkIndex = randIntDiff(pool.length, wordIndex);

        currentPrompt = {
          text: pool[wordIndex].label,
          bgColor: '#f4f4ff',
          textColor: pool[inkIndex].color
        };

        const sizeBase = baseSizeForCount(count);
        floatingBoxes = placeItems(pool.map(function (c, i) {
          // เขียนชื่อสีลงบนกล่อง แต่จงใจให้ "ไม่ตรง" กับสีจริงของกล่องเสมอ (Stroop effect)
          const wrongLabelIdx = randIntDiff(pool.length, i);
          return {
            color: c.color,
            label: pool[wrongLabelIdx].label,
            isCorrect: i === inkIndex,
            w: sizeBase * randRange(0.75, 1.3),
            h: sizeBase * randRange(0.75, 1.3)
          };
        }));
      } else if (currentMode === 'shape') {
        const count = Math.min(countForRound(roundNumber - 1), 8);
        const shapeIdx = Math.floor(Math.random() * SHAPES.length);
        const colorIdx = Math.floor(Math.random() * COLOR_POOL.length);

        const used = new Set([shapeIdx + '_' + colorIdx]);
        const combos = [{ shapeIdx: shapeIdx, colorIdx: colorIdx, isCorrect: true }];

        // ตัวลวงที่ 1: รูปทรงเดียวกัน สีต่างกัน
        const c2 = randIntDiff(COLOR_POOL.length, colorIdx);
        combos.push({ shapeIdx: shapeIdx, colorIdx: c2, isCorrect: false });
        used.add(shapeIdx + '_' + c2);

        // ตัวลวงที่ 2: สีเดียวกัน รูปทรงต่างกัน
        const s2 = randIntDiff(SHAPES.length, shapeIdx);
        combos.push({ shapeIdx: s2, colorIdx: colorIdx, isCorrect: false });
        used.add(s2 + '_' + colorIdx);

        let guard = 0;
        while (combos.length < count && guard < 300) {
          guard++;
          const si = Math.floor(Math.random() * SHAPES.length);
          const ci = Math.floor(Math.random() * COLOR_POOL.length);
          const key = si + '_' + ci;
          if (!used.has(key)) {
            used.add(key);
            combos.push({ shapeIdx: si, colorIdx: ci, isCorrect: false });
          }
        }

        // กล่องโจทย์ (ด้านบน) วาดเป็น "รูปทรง+สีจริง" ซึ่งคือคำตอบที่ถูกต้องที่ต้องกำมือ
        // ส่วนตัวหนังสือกำกับในกล่องโจทย์ จงใจเขียนชื่อรูปทรง+สีอื่นหลอกไว้เสมอ (ไม่ตรงกับรูปทรง/สีจริงที่วาด)
        // ผู้เล่นต้องดูรูปทรงที่วาดจริง ไม่ใช่ตัวหนังสือที่เขียนกำกับ
        const decoyShapeIdx = randIntDiff(SHAPES.length, shapeIdx);
        const decoyColorIdx = randIntDiff(COLOR_POOL.length, colorIdx);
        currentPrompt = {
          shape: SHAPES[shapeIdx].key,
          shapeColor: COLOR_POOL[colorIdx].color,
          text: SHAPES[decoyShapeIdx].label + COLOR_POOL[decoyColorIdx].label,
          bgColor: '#20263f',
          textColor: '#ffffff'
        };

        const sizeBase = baseSizeForCount(count);
        floatingBoxes = placeItems(shuffle(combos).map(function (c) {
          // เขียนชื่อสีลงบนรูปทรง แต่จงใจให้ "ไม่ตรง" กับสีจริงของรูปทรงเสมอ (เพิ่มความสับสน)
          const wrongColorIdx = randIntDiff(COLOR_POOL.length, c.colorIdx);
          return {
            shape: SHAPES[c.shapeIdx].key,
            color: COLOR_POOL[c.colorIdx].color,
            label: COLOR_POOL[wrongColorIdx].label,
            isCorrect: c.isCorrect,
            w: sizeBase * randRange(0.8, 1.25),
            h: sizeBase * randRange(0.8, 1.25)
          };
        }));
      } else {
        // โหมด Digital Tools: หาให้เจอกล่องเครื่องมือดิจิทัลที่มีชื่อตรงกับคำสั่ง
        const count = Math.min(countForRound(roundNumber - 1), 5);
        const pool = shuffle(TOOL_LIST.map(function (name, i) {
          return { name: name, color: TOOL_COLORS[i] };
        })).slice(0, count);
        const targetIndex = Math.floor(Math.random() * pool.length);

        currentPrompt = {
          text: 'หา: ' + pool[targetIndex].name,
          bgColor: '#34495e',
          textColor: '#ffffff'
        };

        const sizeBase = baseSizeForCount(count);
        floatingBoxes = placeItems(pool.map(function (t, i) {
          return {
            tool: t.name,
            color: t.color,
            isCorrect: i === targetIndex,
            w: sizeBase * randRange(1.15, 1.5),
            h: sizeBase * randRange(0.8, 1.0)
          };
        }));
      }

      spawnObstacles(roundNumber, floatingBoxes);
      updateTimeDisplay();
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    function updateSmoothedHand(key, landmark) {
      if (!landmark) {
        smoothedHand[key] = null;
        return null;
      }
      if (!smoothedHand[key]) {
        smoothedHand[key] = { x: landmark.x, y: landmark.y };
      } else {
        smoothedHand[key].x = lerp(smoothedHand[key].x, landmark.x, 0.5);
        smoothedHand[key].y = lerp(smoothedHand[key].y, landmark.y, 0.5);
      }
      return smoothedHand[key];
    }

    // ตรวจว่ามือ "กำ" อยู่หรือไม่ จากจุด landmark ทั้ง 21 จุดของมือข้างนั้น
    // หลักการ: นิ้วที่งอ/กำเข้าหาฝ่ามือ ปลายนิ้ว (tip) จะอยู่ใกล้ข้อมือ (wrist)
    // มากกว่าข้อกลางนิ้ว (pip) — เช็ค 4 นิ้ว (ชี้/กลาง/นาง/ก้อย) ถ้างออย่างน้อย 3 ใน 4 ถือว่ากำมือ
    function isFist(landmarks) {
      if (!landmarks) return false;
      const wrist = landmarks[0];
      function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      const fingers = [
        { tip: 8, pip: 6 },   // นิ้วชี้
        { tip: 12, pip: 10 }, // นิ้วกลาง
        { tip: 16, pip: 14 }, // นิ้วนาง
        { tip: 20, pip: 18 }  // นิ้วก้อย
      ];
      let curled = 0;
      fingers.forEach(function (f) {
        const tipDist = dist(landmarks[f.tip], wrist);
        const pipDist = dist(landmarks[f.pip], wrist);
        if (tipDist < pipDist * 1.05) curled++;
      });
      return curled >= 3;
    }

    function checkBoxTap(key, hand, landmarks, dt) {
      if (!hand) {
        hoverId[key] = null;
        holdProgress[key] = 0;
        holdTargetId[key] = null;
        return;
      }

      const tapRadius = grabRadiusForCount(floatingBoxes.length);

      // หา "กล่องที่ใกล้มือที่สุด" ไว้ทำ highlight เสมอ (แม้ยังไม่ถึงระยะแตะ)
      let nearest = null, nearestDist = Infinity;
      floatingBoxes.forEach(function (b) {
        const d = Math.hypot(hand.x - b.x, hand.y - b.y);
        if (d < tapRadius * 1.5 && d < nearestDist) { nearest = b; nearestDist = d; }
      });
      hoverId[key] = nearest ? nearest.id : null;

      if (isCooldown) { holdProgress[key] = 0; holdTargetId[key] = null; return; } // กำลังรอรอบถัดไปหลังแตะถูก
      if (tapCooldown[key] > 0) { tapCooldown[key]--; holdProgress[key] = 0; holdTargetId[key] = null; return; } // กันแตะรัวหลังแตะผิด

      // หากล่องที่มืออยู่ในระยะแตะจริงๆ (ใกล้กว่า nearest ด้านบน)
      let target = null, targetDist = Infinity;
      floatingBoxes.forEach(function (b) {
        const d = Math.hypot(hand.x - b.x, hand.y - b.y);
        if (d < tapRadius && d < targetDist) { target = b; targetDist = d; }
      });

      // เปลี่ยนกล่องเป้าหมาย (หรือมือหลุดออกจากกล่อง) ให้เริ่มนับ progress การกำมือใหม่
      if (!target || holdTargetId[key] !== target.id) {
        holdTargetId[key] = target ? target.id : null;
        holdProgress[key] = 0;
      }

      if (!target) return;

      // ต้อง "กำมือค้างไว้" บนกล่องเดิมให้ครบ HOLD_DURATION_MS ถึงจะถือว่ายืนยันการเลือก
      if (isFist(landmarks)) {
        holdProgress[key] = Math.min(1, holdProgress[key] + dt * HOLD_GROW_RATE);
      } else {
        holdProgress[key] = Math.max(0, holdProgress[key] - dt * HOLD_DECAY_RATE);
      }

      if (holdProgress[key] < 1) return;

      holdProgress[key] = 0;
      holdTargetId[key] = null;

      if (target.isCorrect) {
        score += 10;
        document.getElementById('scoreDisplay').innerText = 'คะแนน: ' + score;
        spawnParticles(target.x, target.y, target.color || '#fff');
        isCooldown = true;
        setTimeout(function () {
          isCooldown = false;
          generateNewPrompt();
        }, 350);
      } else {
        feedback = { text: 'ยังไม่ใช่กล่องนี้นะ ลองใหม่!', timer: 50, color: '#ff4d4d' };
        tapCooldown[key] = 30;
      }
    }

    function checkObstacleHit(key, hand) {
      if (!hand) return;
      if (obstacleCooldown[key] > 0) { obstacleCooldown[key]--; return; }

      for (let i = 0; i < obstacles.length; i++) {
        const o = obstacles[i];
        if (Math.hypot(hand.x - o.x, hand.y - o.y) < OBSTACLE_HIT_RADIUS) {
          score = Math.max(0, score - 5);
          document.getElementById('scoreDisplay').innerText = 'คะแนน: ' + score;
          feedback = { text: '⚠️ โดนสิ่งกีดขวาง! -5 คะแนน', timer: 55, color: '#ff4d4d' };
          spawnParticles(o.x, o.y, '#ff4d4d');
          obstacleCooldown[key] = 45;
          break;
        }
      }
    }

    function spawnParticles(cx, cy, color) {
      for (let i = 0; i < 24; i++) {
        const angle = (i / 24) * Math.PI * 2;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * randRange(0.003, 0.008),
          vy: Math.sin(angle) * randRange(0.003, 0.008),
          life: 40,
          color: color
        });
      }
    }

    function onResults(results) {
      if (gameState !== 'playing') return;

      const now = performance.now();
      const t = (now - startTime) / 1000;
      const minDim = Math.min(canvasElement.width, canvasElement.height);

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.fillStyle = 'rgba(0,0,0,0.15)';
      canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

      const speedMul = speedMultiplierForRound(roundNumber);
      floatingBoxes.forEach(function (b) {
        b.x = b.baseX + Math.sin(t * b.speed * speedMul + b.phase) * b.radiusX;
        b.y = b.baseY + Math.cos(t * b.speed * speedMul * 0.8 + b.phase) * b.radiusY;
      });
      obstacles.forEach(function (o) {
        o.x = o.baseX + Math.sin(t * o.speed * speedMul + o.phase) * o.radiusX;
        o.y = o.baseY + Math.cos(t * o.speed * speedMul * 0.8 + o.phase) * o.radiusY;
      });

      const dt = lastFrameTime ? Math.min(80, now - lastFrameTime) : 16; // cap กัน dt กระโดดตอนกล้องกระตุก
      lastFrameTime = now;

      // อ่านผลจาก MediaPipe Hands: จุด landmark ครบ 21 จุดต่อมือ (แม่นยำกว่าประมาณจากโครงร่างร่างกาย)
      // หมายเหตุ: เฟรมที่ส่งเข้าโมเดลไม่ได้ mirror ไว้ก่อน (mirror ทำที่ CSS ตอนแสดงผลเท่านั้น)
      // ส่วน handedness ของ MediaPipe ตั้งสมมติฐานว่าภาพถูก mirror มา จึงอาจสลับป้ายซ้าย/ขวา
      // จากมุมมองจริงของผู้เล่น แต่ไม่กระทบการเล่นเพราะมือทั้งสองข้างใช้ลอจิกเดียวกันทุกอย่าง
      let rawLandmarks = { left: null, right: null };
      if (results.multiHandLandmarks && results.multiHandedness) {
        results.multiHandLandmarks.forEach(function (lm, i) {
          const label = results.multiHandedness[i] ? results.multiHandedness[i].label : 'Right';
          const key = label === 'Left' ? 'left' : 'right';
          rawLandmarks[key] = lm;
        });
      }

      // ใช้ปลายนิ้วชี้ (landmark 8) เป็นตำแหน่งเคอร์เซอร์ของมือแต่ละข้าง
      const leftHand = updateSmoothedHand('left', rawLandmarks.left ? rawLandmarks.left[8] : null);
      const rightHand = updateSmoothedHand('right', rawLandmarks.right ? rawLandmarks.right[8] : null);

      checkBoxTap('left', leftHand, rawLandmarks.left, dt);
      checkBoxTap('right', rightHand, rawLandmarks.right, dt);
      checkObstacleHit('left', leftHand);
      checkObstacleHit('right', rightHand);

      drawPromptBox();
      floatingBoxes.forEach(function (b) { drawBox(b, minDim); });
      obstacles.forEach(function (o) { drawObstacle(o, minDim, t); });
      drawParticles();
      drawFeedback();

      if (leftHand) drawHandCursor(leftHand, 'cyan', holdProgress.left, isFist(rawLandmarks.left));
      if (rightHand) drawHandCursor(rightHand, 'magenta', holdProgress.right, isFist(rawLandmarks.right));

      canvasCtx.restore();
    }

    function drawMirroredText(text, cx, cy, strokeColor, strokeWidth) {
      canvasCtx.save();
      canvasCtx.textAlign = "center";
      canvasCtx.textBaseline = "middle";
      canvasCtx.translate(cx, cy);
      canvasCtx.scale(-1, 1);
      if (strokeColor) {
        canvasCtx.lineJoin = 'round';
        canvasCtx.lineWidth = strokeWidth || 4;
        canvasCtx.strokeStyle = strokeColor;
        canvasCtx.strokeText(text, 0, 0);
      }
      canvasCtx.fillText(text, 0, 0);
      canvasCtx.restore();
    }

    function roundRectPath(x, y, w, h, r) {
      canvasCtx.beginPath();
      canvasCtx.moveTo(x + r, y);
      canvasCtx.arcTo(x + w, y, x + w, y + h, r);
      canvasCtx.arcTo(x + w, y + h, x, y + h, r);
      canvasCtx.arcTo(x, y + h, x, y, r);
      canvasCtx.arcTo(x, y, x + w, y, r);
      canvasCtx.closePath();
    }

    function shapePath(shape, cx, cy, w, h) {
      canvasCtx.beginPath();
      if (shape === 'circle') {
        canvasCtx.arc(cx, cy, Math.min(w, h) / 2, 0, Math.PI * 2);
      } else if (shape === 'triangle') {
        canvasCtx.moveTo(cx, cy - h / 2);
        canvasCtx.lineTo(cx + w / 2, cy + h / 2);
        canvasCtx.lineTo(cx - w / 2, cy + h / 2);
        canvasCtx.closePath();
      } else if (shape === 'star') {
        const spikes = 5, outerR = Math.min(w, h) / 2, innerR = outerR * 0.45;
        for (let i = 0; i < spikes * 2; i++) {
          const ang = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
          const rr = i % 2 === 0 ? outerR : innerR;
          const px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
          if (i === 0) canvasCtx.moveTo(px, py); else canvasCtx.lineTo(px, py);
        }
        canvasCtx.closePath();
      } else {
        // square / default
        roundRectPath(cx - w / 2, cy - h / 2, w, h, Math.min(14, w * 0.12));
      }
    }

    function drawPromptBox() {
      const isShapePrompt = currentMode === 'shape' && currentPrompt.shape;
      const boxW = Math.min(isShapePrompt ? 520 : 460, canvasElement.width * (isShapePrompt ? 0.68 : 0.6));
      const boxH = Math.max(isShapePrompt ? 92 : 70, canvasElement.height * (isShapePrompt ? 0.115 : 0.09));
      const boxX = (canvasElement.width / 2) - (boxW / 2);
      const boxY = canvasElement.height * 0.04;

      canvasCtx.save();
      canvasCtx.shadowColor = 'rgba(0,0,0,0.4)';
      canvasCtx.shadowBlur = 12;
      canvasCtx.fillStyle = currentPrompt.bgColor;
      roundRectPath(boxX, boxY, boxW, boxH, 18);
      canvasCtx.fill();
      canvasCtx.restore();

      if (isShapePrompt) {
        // ไอคอนรูปทรง+สีจริง (คือคำตอบที่ถูกต้อง) ฝั่งหนึ่งของกล่องโจทย์
        const iconSize = boxH * 0.6;
        const iconCx = boxX + boxH * 0.62;
        const iconCy = boxY + boxH / 2;

        canvasCtx.save();
        canvasCtx.shadowColor = 'rgba(0,0,0,0.35)';
        canvasCtx.shadowBlur = 6;
        canvasCtx.fillStyle = currentPrompt.shapeColor;
        shapePath(currentPrompt.shape, iconCx, iconCy, iconSize, iconSize);
        canvasCtx.fill();
        canvasCtx.lineWidth = 2.5;
        canvasCtx.strokeStyle = 'rgba(255,255,255,0.85)';
        canvasCtx.stroke();
        canvasCtx.restore();

        // เส้นแบ่งบางๆ คั่นระหว่างไอคอน (คำตอบจริง) กับข้อความหลอก
        canvasCtx.save();
        canvasCtx.strokeStyle = 'rgba(255,255,255,0.15)';
        canvasCtx.lineWidth = 1.5;
        canvasCtx.beginPath();
        canvasCtx.moveTo(boxX + boxH * 1.14, boxY + boxH * 0.18);
        canvasCtx.lineTo(boxX + boxH * 1.14, boxY + boxH * 0.82);
        canvasCtx.stroke();
        canvasCtx.restore();

        // ตัวหนังสือหลอก (ชื่อรูปทรง+สีอื่น ไม่ตรงกับไอคอนที่วาดจริง)
        const textCx = boxX + boxH * 1.14 + (boxX + boxW - (boxX + boxH * 1.14)) / 2;
        canvasCtx.fillStyle = currentPrompt.textColor;
        canvasCtx.font = "bold " + Math.round(boxH * 0.22) + "px Kanit";
        drawMirroredText(currentPrompt.text, textCx, iconCy, 'rgba(0,0,0,0.5)', Math.round(boxH * 0.035));
      } else {
        canvasCtx.fillStyle = currentPrompt.textColor;
        canvasCtx.font = "bold " + Math.round(boxH * 0.34) + "px Kanit";
        const promptOutline = isLightColor(currentPrompt.textColor) ? 'rgba(20,20,30,0.55)' : 'rgba(255,255,255,0.7)';
        drawMirroredText(currentPrompt.text, canvasElement.width / 2, boxY + (boxH / 2), promptOutline, Math.round(boxH * 0.05));
      }
    }

    function wrapLabel(text, maxLen) {
      if (text.length <= maxLen) return [text];
      const words = text.split(' ');
      if (words.length === 1) return [text];
      let bestSplit = 1, bestDiff = Infinity;
      for (let i = 1; i < words.length; i++) {
        const line1 = words.slice(0, i).join(' ');
        const line2 = words.slice(i).join(' ');
        const diff = Math.abs(line1.length - line2.length);
        if (diff < bestDiff) { bestDiff = diff; bestSplit = i; }
      }
      return [words.slice(0, bestSplit).join(' '), words.slice(bestSplit).join(' ')];
    }

    function drawToolLabel(text, cx, cy, w, h) {
      const lines = wrapLabel(text, 12);
      const longest = Math.max.apply(null, lines.map(function (l) { return l.length; }));
      let fontSize = Math.min(h * 0.26, (w * 0.88) / (longest * 0.56));
      fontSize = Math.max(fontSize, 10);

      canvasCtx.save();
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.font = "bold " + Math.round(fontSize) + "px Kanit";
      canvasCtx.shadowColor = 'rgba(0,0,0,0.4)';
      canvasCtx.shadowBlur = 3;
      const lineHeight = fontSize * 1.15;
      const startY = cy - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach(function (line, i) {
        drawMirroredText(line, cx, startY + i * lineHeight);
      });
      canvasCtx.restore();
    }

    function drawBox(b, minDim) {
      const cx = b.x * canvasElement.width;
      const cy = b.y * canvasElement.height;
      const w = b.w * minDim;
      const h = b.h * minDim;
      const isHovered = hoverId.left === b.id || hoverId.right === b.id;

      canvasCtx.save();
      canvasCtx.shadowColor = 'rgba(0,0,0,0.5)';
      canvasCtx.shadowBlur = isHovered ? 24 : 10;
      canvasCtx.fillStyle = b.color;

      if (currentMode === 'shape' && b.shape) {
        shapePath(b.shape, cx, cy, w, h);
      } else {
        shapePath('square', cx, cy, w, h);
      }
      canvasCtx.fill();

      if (isHovered) {
        canvasCtx.lineWidth = 4;
        canvasCtx.strokeStyle = 'white';
        canvasCtx.stroke();
      }
      canvasCtx.restore();

      if (currentMode === 'digital' && b.tool) {
        drawToolLabel(b.tool, cx, cy, w, h);
      } else if (b.label) {
        canvasCtx.save();
        canvasCtx.fillStyle = isLightColor(b.color) ? '#1a1a1a' : '#ffffff';
        canvasCtx.font = "bold " + Math.round(Math.min(w, h) * 0.16) + "px Kanit";
        canvasCtx.shadowColor = 'rgba(0,0,0,0.35)';
        canvasCtx.shadowBlur = 3;
        drawMirroredText(b.label, cx, cy);
        canvasCtx.restore();
      }
    }

    function drawObstacle(o, minDim, t) {
      const cx = o.x * canvasElement.width;
      const cy = o.y * canvasElement.height;
      const r = o.selfR * minDim * (1 + Math.sin(t * 6 + o.phase) * 0.06);

      canvasCtx.save();
      canvasCtx.shadowColor = 'rgba(255,60,60,0.65)';
      canvasCtx.shadowBlur = 18;
      canvasCtx.beginPath();
      const spikes = 8;
      for (let i = 0; i < spikes * 2; i++) {
        const ang = (i / (spikes * 2)) * Math.PI * 2 + t * 1.2;
        const rr = i % 2 === 0 ? r : r * 0.55;
        const px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
        if (i === 0) canvasCtx.moveTo(px, py); else canvasCtx.lineTo(px, py);
      }
      canvasCtx.closePath();
      canvasCtx.fillStyle = '#e74c3c';
      canvasCtx.fill();
      canvasCtx.lineWidth = 3;
      canvasCtx.strokeStyle = '#ffe082';
      canvasCtx.stroke();
      canvasCtx.restore();

      canvasCtx.fillStyle = 'white';
      canvasCtx.font = "bold " + Math.round(r * 1.1) + "px Kanit";
      drawMirroredText('!', cx, cy);
    }

    function drawHandCursor(hand, color, progress, fisting) {
      const x = hand.x * canvasElement.width;
      const y = hand.y * canvasElement.height;
      const baseR = fisting ? 13 : 16;

      canvasCtx.save();
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, baseR, 0, Math.PI * 2);
      canvasCtx.fillStyle = color;
      canvasCtx.globalAlpha = fisting ? 1 : 0.9;
      canvasCtx.fill();
      canvasCtx.lineWidth = 3;
      canvasCtx.strokeStyle = 'white';
      canvasCtx.stroke();
      canvasCtx.restore();

      // วง progress รอบเคอร์เซอร์ แสดงความคืบหน้าตอน "กำมือค้าง" เพื่อยืนยัน
      if (progress > 0) {
        canvasCtx.save();
        canvasCtx.beginPath();
        canvasCtx.lineWidth = 5;
        canvasCtx.lineCap = 'round';
        canvasCtx.strokeStyle = progress >= 0.99 ? '#7CFC00' : '#ffffff';
        canvasCtx.arc(x, y, baseR + 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
        canvasCtx.stroke();
        canvasCtx.restore();
      }

      if (fisting) {
        canvasCtx.save();
        canvasCtx.fillStyle = '#ffffff';
        canvasCtx.font = "600 12px Kanit";
        canvasCtx.shadowColor = 'rgba(0,0,0,0.6)';
        canvasCtx.shadowBlur = 3;
        drawMirroredText('กำค้าง...', x, y + baseR + 22);
        canvasCtx.restore();
      }
    }

    function drawParticles() {
      particles = particles.filter(function (p) { return p.life > 0; });
      particles.forEach(function (p) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        canvasCtx.save();
        canvasCtx.globalAlpha = Math.max(0, p.life / 40);
        canvasCtx.fillStyle = p.color;
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * canvasElement.width, p.y * canvasElement.height, 6, 0, Math.PI * 2);
        canvasCtx.fill();
        canvasCtx.restore();
      });
    }

    function drawFeedback() {
      if (!feedback) return;
      feedback.timer -= 1;
      if (feedback.timer <= 0) { feedback = null; return; }

      canvasCtx.save();
      canvasCtx.globalAlpha = Math.min(1, feedback.timer / 20);
      canvasCtx.fillStyle = feedback.color || '#ff4d4d';
      canvasCtx.font = "bold " + Math.round(canvasElement.height * 0.032) + "px Kanit";
      drawMirroredText(feedback.text, canvasElement.width / 2, canvasElement.height * (CENTER_ZONE.y + CENTER_ZONE.r + 0.08));
      canvasCtx.restore();
    }

    function endGame() {
      gameState = 'ended';
      clearInterval(timerInterval);
      if (camera) camera.stop();

      if (!hasReturnUrl) {
        // ไม่มี returnUrl (เช่นเปิดหน้านี้ตรงๆ) ก็แสดงคะแนนสรุปในหน้านี้แทนการ redirect
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('resultScoreText').innerText = score;
        document.getElementById('result-box').style.display = 'block';
        return;
      }

      const params = new URLSearchParams({
        page: 'result',
        score: score,
        name: pName,
        empId: pEmpId,
        category: currentMode
      });
      window.location.href = returnUrl + (returnUrl.includes('?') ? '&' : '?') + params.toString();
    }
  </script>
</body>
