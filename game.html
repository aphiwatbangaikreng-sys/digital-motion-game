<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>Digital Motion Game - เล่นเกม</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    body {
      font-family: 'Kanit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #game-screen {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    video {
      display: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .hud {
      position: absolute;
      top: 10px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 10;
      font-size: clamp(18px, 3vw, 28px);
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .instructions {
      position: absolute;
      bottom: 12px;
      width: 100%;
      text-align: center;
      color: white;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
      font-size: clamp(13px, 1.8vw, 18px);
      z-index: 10;
      pointer-events: none;
    }

    #error-box {
      display: none;
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
    }

    #error-box button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="game-screen">
    <div id="game-container">
      <div class="hud">
        <div id="scoreDisplay">คะแนน: 0</div>
        <div id="timeDisplay">เวลา: 30</div>
      </div>
      <video id="video" autoplay playsinline></video>
      <canvas id="output_canvas"></canvas>
      <p class="instructions">ขยับมือ (ซ้ายหรือขวา) ไปแตะที่กล่องคำตอบที่ถูกต้อง!</p>
    </div>
  </div>

  <div id="error-box">
    <h3>⚠️ ไม่สามารถเข้าถึงกล้องได้</h3>
    <p id="error-message"></p>
    <button onclick="window.close()">ปิดแท็บนี้</button>
  </div>

  <script>
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const videoElement = document.getElementById('video');

    // อ่านค่าจาก URL query string (หน้านี้โฮสต์แยกจาก Apps Script)
    const urlParams = new URLSearchParams(window.location.search);
    const pName = urlParams.get('name') || 'ผู้เล่น';
    const pEmpId = urlParams.get('empId') || '';
    const currentMode = urlParams.get('mode') || 'color';
    const returnUrl = urlParams.get('returnUrl') || '';

    let pose, camera;
    let gameState = 'idle';
    let score = 0;
    let timeLeft = 30;
    let timerInterval;
    let isCooldown = false;
    let currentPrompt = {};

    // ตำแหน่งกล่องคำตอบ 4 ตำแหน่ง (สัดส่วนของจอ) — จะถูกสุ่มสลับให้แต่ละรอบ
    const boxPositions = [
      { x: 0.04, y: 0.32, w: 0.20, h: 0.20 },
      { x: 0.76, y: 0.32, w: 0.20, h: 0.20 },
      { x: 0.22, y: 0.68, w: 0.20, h: 0.20 },
      { x: 0.56, y: 0.68, w: 0.20, h: 0.20 }
    ];

    // เก็บกล่องคำตอบของรอบปัจจุบัน (ตำแหน่ง + เนื้อหา ถูกสุ่มรวมกันใหม่ทุกรอบ)
    let currentBoxes = [];

    function shuffle(array) {
      const a = array.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = a[i];
        a[i] = a[j];
        a[j] = tmp;
      }
      return a;
    }

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function showError(msg) {
      document.getElementById('game-screen').style.display = 'none';
      const box = document.getElementById('error-box');
      box.style.display = 'block';
      document.getElementById('error-message').innerText = msg;
    }

    if (!returnUrl) {
      showError('ไม่พบข้อมูลผู้เล่น กรุณาปิดแท็บนี้แล้วเริ่มเกมใหม่จากหน้าแรก (กด "เริ่มเกมเลย!")');
    } else {
      initMediaPipe();
    }

    function initMediaPipe() {
      pose = new Pose({
        locateFile: function (file) {
          return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;
        }
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults(onResults);

      camera = new Camera(videoElement, {
        onFrame: async function () {
          await pose.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });

      camera.start().then(function () {
        gameState = 'playing';
        score = 0;
        timeLeft = 30;
        generateNewPrompt();

        timerInterval = setInterval(function () {
          timeLeft--;
          document.getElementById('timeDisplay').innerText = 'เวลา: ' + timeLeft;
          if (timeLeft <= 0) endGame();
        }, 1000);
      }).catch(function (error) {
        showError(
          'เปิดกล้องไม่สำเร็จ: ' + error.message +
          '\nโปรดตรวจสอบว่าไม่มีโปรแกรมอื่น (เช่น Zoom, Meet) แย่งใช้กล้องอยู่ และอนุญาตสิทธิ์กล้องให้เว็บไซต์นี้'
        );
      });
    }

    function generateNewPrompt() {
      const shuffledPositions = shuffle(boxPositions);

      if (currentMode === 'color') {
        const colorDefs = [
          { color: 'red', label: 'สีแดง' },
          { color: '#00FF00', label: 'สีเขียว' },
          { color: 'blue', label: 'สีน้ำเงิน' },
          { color: 'yellow', label: 'สีเหลือง' }
        ];

        const targetIndex = Math.floor(Math.random() * colorDefs.length);
        let fakeColorIndex = Math.floor(Math.random() * colorDefs.length);
        while (fakeColorIndex === targetIndex) {
          fakeColorIndex = Math.floor(Math.random() * colorDefs.length);
        }

        currentPrompt = {
          text: colorDefs[targetIndex].label,
          bgColor: colorDefs[fakeColorIndex].color,
          textColor: 'black'
        };

        currentBoxes = colorDefs.map(function (c, i) {
          return {
            color: c.color,
            isCorrect: i === targetIndex,
            x: shuffledPositions[i].x,
            y: shuffledPositions[i].y,
            w: shuffledPositions[i].w,
            h: shuffledPositions[i].h
          };
        });
      } else {
        const toolDefs = [
          { tool: 'ERP', question: 'ระบบวางแผนทรัพยากร' },
          { tool: 'SCADA', question: 'ระบบควบคุมเครื่องจักร' },
          { tool: 'IoT', question: 'ดึงข้อมูลเซ็นเซอร์' },
          { tool: 'MES', question: 'ควบคุมการผลิตในไลน์' }
        ];

        const targetIndex = Math.floor(Math.random() * toolDefs.length);

        currentPrompt = {
          text: toolDefs[targetIndex].question,
          bgColor: '#34495e',
          textColor: 'white'
        };

        currentBoxes = toolDefs.map(function (t, i) {
          return {
            tool: t.tool,
            isCorrect: i === targetIndex,
            x: shuffledPositions[i].x,
            y: shuffledPositions[i].y,
            w: shuffledPositions[i].w,
            h: shuffledPositions[i].h
          };
        });
      }
    }

    function onResults(results) {
      if (gameState !== 'playing') return;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      drawPromptBox();
      drawTargetBoxes();

      if (results.poseLandmarks) {
        const leftWrist = results.poseLandmarks[15];
        const rightWrist = results.poseLandmarks[16];

        if (leftWrist) {
          drawPoint(leftWrist.x, leftWrist.y, 'cyan');
          checkCollision(leftWrist);
        }
        if (rightWrist) {
          drawPoint(rightWrist.x, rightWrist.y, 'magenta');
          checkCollision(rightWrist);
        }
      }
      canvasCtx.restore();
    }

    // วาดข้อความแบบ "กลับด้านสวนทาง" ล่วงหน้า เพราะทั้ง canvas ถูก mirror ด้วย CSS (transform: scaleX(-1))
    // ถ้าวาดตัวหนังสือแบบปกติ มันจะกลับด้านตอนแสดงผลจริง ต้อง flip ที่นี่อีกทีเพื่อหักล้างกัน
    function drawMirroredText(text, cx, cy) {
      canvasCtx.save();
      canvasCtx.textAlign = "center";
      canvasCtx.textBaseline = "middle";
      canvasCtx.translate(cx, cy);
      canvasCtx.scale(-1, 1);
      canvasCtx.fillText(text, 0, 0);
      canvasCtx.restore();
    }

    function drawPromptBox() {
      const boxW = Math.min(420, canvasElement.width * 0.5);
      const boxH = Math.max(70, canvasElement.height * 0.09);
      const boxX = (canvasElement.width / 2) - (boxW / 2);
      const boxY = canvasElement.height * 0.05;

      canvasCtx.fillStyle = currentPrompt.bgColor;
      canvasCtx.fillRect(boxX, boxY, boxW, boxH);

      canvasCtx.fillStyle = currentPrompt.textColor;
      canvasCtx.font = "bold " + Math.round(boxH * 0.4) + "px Kanit";
      drawMirroredText(currentPrompt.text, canvasElement.width / 2, boxY + (boxH / 2));
    }

    function drawTargetBoxes() {
      currentBoxes.forEach(function (box) {
        const x = box.x * canvasElement.width;
        const y = box.y * canvasElement.height;
        const w = box.w * canvasElement.width;
        const h = box.h * canvasElement.height;

        canvasCtx.fillStyle = currentMode === 'color' ? box.color : '#e0e0e0';
        canvasCtx.fillRect(x, y, w, h);

        if (currentMode === 'factory') {
          canvasCtx.fillStyle = '#333';
          canvasCtx.font = "bold 24px Kanit";
          drawMirroredText(box.tool, x + w / 2, y + h / 2);
        }
      });
    }

    function drawPoint(normX, normY, color) {
      if (!normX || !normY) return;
      const x = normX * canvasElement.width;
      const y = normY * canvasElement.height;
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, 15, 0, 2 * Math.PI);
      canvasCtx.fillStyle = color;
      canvasCtx.fill();
    }

    function checkCollision(wrist) {
      if (!wrist || isCooldown) return;

      const handX = wrist.x;
      const handY = wrist.y;

      currentBoxes.forEach(function (box) {
        if (handX >= box.x && handX <= box.x + box.w &&
          handY >= box.y && handY <= box.y + box.h) {

          if (box.isCorrect) {
            score += 10;
            document.getElementById('scoreDisplay').innerText = 'คะแนน: ' + score;
            isCooldown = true;
            generateNewPrompt();

            setTimeout(function () { isCooldown = false; }, 500);
          }
        }
      });
    }

    function endGame() {
      gameState = 'ended';
      clearInterval(timerInterval);
      if (camera) camera.stop();

      const params = new URLSearchParams({
        page: 'result',
        score: score,
        name: pName,
        empId: pEmpId
      });
      window.location.href = returnUrl + (returnUrl.includes('?') ? '&' : '?') + params.toString();
    }
  </script>
</body>

</html>
